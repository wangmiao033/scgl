name: Apply Vercel storage client migration

on:
  push:
    branches:
      - agent/vercel-storage-migration

permissions:
  contents: write

jobs:
  patch-client-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vercel-storage-migration
          fetch-depth: 0
      - name: Patch client upload source
        run: node scripts/migrate-client-upload.mjs
      - name: Commit patched page
        shell: bash
        run: |
          if git diff --quiet -- src/app/page.tsx; then
            echo "Client upload source is already migrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "Use Vercel Blob client uploads"
          git push origin HEAD:agent/vercel-storage-migration
