name: Patch Today Updates Workbench

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-today-workbench.yml'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Install Today Updates workbench patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire migrated workbench into main UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text(encoding='utf-8')

          imp = "import { TodayUpdatesPanel } from '@/components/today-updates-panel';"
          if imp not in s:
              anchor = "import { Textarea } from '@/components/ui/textarea';"
              if anchor not in s:
                  raise SystemExit('import anchor not found')
              s = s.replace(anchor, anchor + "\n" + imp, 1)

          panel = """            {/* Migrated Today Updates Workbench */}\n            <TodayUpdatesPanel assets={assets} projects={projects} channels={channels} />\n\n"""
          if '<TodayUpdatesPanel assets={assets}' not in s:
              anchor = "            {/* Upload Zone */}"
              if anchor not in s:
                  raise SystemExit('main-content anchor not found')
              s = s.replace(anchor, panel + anchor, 1)

          workbench_button = """
        {/* Today Updates Workbench */}
        <button
          onClick={() => document.getElementById('today-updates')?.scrollIntoView({ behavior: 'smooth', block: 'start' })}
          className="w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md text-sm transition-colors mb-0.5 text-[#aaa] hover:text-white hover:bg-[#333] border-l-2 border-transparent"
        >
          <BarChart3 size={16} className="shrink-0" />
          <span className="truncate">素材工作台</span>
        </button>
"""
          if '<span className="truncate">素材工作台</span>' not in s:
              anchor = """          <span className="truncate">未分类</span>\n        </button>\n\n        {/* Separator */}"""
              if anchor not in s:
                  raise SystemExit('sidebar anchor not found')
              replacement = """          <span className="truncate">未分类</span>\n        </button>\n""" + workbench_button + """\n        {/* Separator */}"""
              s = s.replace(anchor, replacement, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/page.tsx src/components/today-updates-panel.tsx
          git rm .github/workflows/patch-today-workbench.yml
          git commit -m 'Wire Today Updates workbench into main UI'
          git push
